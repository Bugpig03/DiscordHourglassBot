{% extends "base.html" %}

{% block title %}{{ t('auth.callback_loading') }}{% endblock %}

{% block content %}
<div class="auth-page-container" style="max-width: 440px; margin: 60px auto 90px; padding: 0 16px; text-align: center;">
    <div class="gray-box" style="padding: 40px 28px; border-radius: 2px; background: rgba(30, 31, 36, 0.94); border: 1px solid rgba(255, 255, 255, 0.09); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);">
        
        <!-- Animated Spinner -->
        <div style="position: relative; width: 64px; height: 64px; margin: 0 auto 20px;">
            <div style="position: absolute; inset: 0; border: 3px solid rgba(88, 101, 242, 0.2); border-top-color: #5865F2; border-radius: 50%; animation: spin 0.9s cubic-bezier(0.4, 0, 0.2, 1) infinite;"></div>
            <div style="position: absolute; inset: 10px; display: flex; align-items: center; justify-content: center; background: rgba(88, 101, 242, 0.15); border-radius: 50%;">
                <svg width="22" height="22" style="color: #5865F2;" aria-hidden="true" viewBox="0 -0.5 9 9" fill="currentColor" shape-rendering="crispEdges" data-px="discord"><path d="M1 0h2v1h-2zM6 0h2v1h-2zM0 1h9v1h-9zM0 2h9v1h-9zM0 3h2v1h-2zM3 3h3v1h-3zM7 3h2v1h-2zM0 4h2v1h-2zM3 4h3v1h-3zM7 4h2v1h-2zM0 5h9v1h-9zM0 6h3v1h-3zM6 6h3v1h-3zM1 7h1v1h-1zM7 7h1v1h-1z"/></svg>
            </div>
        </div>

        <h2 class="big-bold-text" style="font-size: 1.25rem; margin: 0 0 6px; color: #ffffff;">
            {{ t('auth.callback_loading') }}
        </h2>
        <p class="small-text gray" style="margin: 0; line-height: 1.5; font-size: 0.88rem;">
            {{ t('auth.callback_desc') }}
        </p>
    </div>
</div>

<style>
@keyframes spin {
    to { transform: rotate(360deg); }
}
</style>

<script nonce="{{ csp_nonce() }}">
document.addEventListener("DOMContentLoaded", function() {
    function finishAuth(success, redirectUrl) {
        if (window.opener && !window.opener.closed) {
            try {
                window.opener.postMessage({ type: "DISCORD_AUTH_SUCCESS" }, window.location.origin);
            } catch (e) {}
            setTimeout(function() { window.close(); }, 250);
            return;
        }
        window.location.href = redirectUrl || "{{ next_url or '/' }}";
    }

    {% if auto_close %}
    finishAuth(true, "{{ next_url or '/' }}");
    return;
    {% endif %}

    {% if error %}
    if (window.opener && !window.opener.closed) {
        window.close();
        return;
    }
    window.location.href = "{{ url_for('auth.login', error=error) }}";
    return;
    {% endif %}

    try {
        const hash = window.location.hash.substring(1);
        const search = window.location.search.substring(1);
        const params = new URLSearchParams(hash || search);

        const err = params.get('error');
        if (err) {
            if (window.opener && !window.opener.closed) {
                window.close();
                return;
            }
            window.location.href = "{{ url_for('auth.login') }}?error=" + encodeURIComponent(err);
            return;
        }

        const accessToken = params.get('access_token');
        const state = params.get('state');

        if (!accessToken) {
            finishAuth(false, "{{ url_for('auth.login') }}");
            return;
        }

        fetch("{{ url_for('auth.token_login') }}", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Accept": "application/json"
            },
            body: JSON.stringify({
                access_token: accessToken,
                state: state
            })
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
            if (data && data.success) {
                finishAuth(true, data.redirect || "{{ next_url or '/' }}");
            } else {
                finishAuth(false, "{{ url_for('auth.login') }}?error=token_failed");
            }
        })
        .catch(function(e) {
            console.error("Auth error:", e);
            finishAuth(false, "{{ url_for('auth.login') }}?error=token_failed");
        });
    } catch (e) {
        finishAuth(false, "{{ url_for('auth.login') }}?error=token_failed");
    }
});
</script>
{% endblock %}
