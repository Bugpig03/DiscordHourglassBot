name: Build and Push Hourglass Bot

on:
  push:
    tags:
      # Se déclenche dès que tu pousses un tag pour le bot (ex: bot-v3.0.0)
      - 'bot-v*.*.*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extraire les métadonnées Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: bugpig/hourglass_bot
          flavor: |
            latest=auto
          tags: |
            type=match,pattern=bot-v(.*),group=1
            type=raw,value=latest

      - name: Compiler et publier l'image Docker
        uses: docker/build-push-action@v5
        with:
          context: ./bot
          file: ./bot/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
